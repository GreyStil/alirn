{% extends 'base.html' %}

{% block title %}Вход - Alirn{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-lg-6 offset-lg-3">
            <div class="card" style="background-color: #16213e; border-color: #e94560;">
                <div class="card-body">
                    <h5 class="card-title text-center mb-4">Вход в систему</h5>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Имя пользователя или Email</label>
                            <input type="text" name="username" class="form-control" required autofocus>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Пароль</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 mb-3">Войти</button>
                        
                        <hr>
                        
                        <p class="text-center">
                            Нет аккаунта? <a href="{% url 'accounts:register' %}">Зарегистрируйтесь</a>
                        </p>
                        <p class="text-center">
                            <a href="{% url 'accounts:password_reset' %}">Забыли пароль?</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
