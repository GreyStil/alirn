{% extends 'base.html' %}

{% block title %}Пополнение баланса - Alirn{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-lg-6 offset-lg-3">
            <div class="card" style="background-color: #16213e; border-color: #e94560;">
                <div class="card-body">
                    <h5 class="card-title text-center mb-4">💳 Пополнить баланс</h5>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Сумма (₽)</label>
                            <input type="number" name="amount" class="form-control" placeholder="Введите сумму" min="1" step="1" required autofocus>
                            <small class="text-muted">Минимум 1 ₽</small>
                        </div>
                        
                        <div class="mb-3">
                            <p style="color: #999; font-size: 12px;">
                                После подтверждения вы будете перенаправлены на страницу оплаты для завершения транзакции.
                            </p>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">Продолжить</button>
                        
                        <hr>
                        
                        <a href="{% url 'accounts:profile_balance' %}" class="btn btn-outline-secondary w-100">Отмена</a>
                    </form>
                </div>
            </div>
            
            <!-- Рекомендуемые суммы -->
            <div class="card mt-4" style="background-color: #0f3460; border-color: #333;">
                <div class="card-body">
                    <h6 class="mb-3">Популярные суммы</h6>
                    <div class="d-grid gap-2">
                        <button class="btn btn-outline-primary btn-sm" onclick="setAmount(500)">500 ₽</button>
                        <button class="btn btn-outline-primary btn-sm" onclick="setAmount(1000)">1000 ₽</button>
                        <button class="btn btn-outline-primary btn-sm" onclick="setAmount(2500)">2500 ₽</button>
                        <button class="btn btn-outline-primary btn-sm" onclick="setAmount(5000)">5000 ₽</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function setAmount(amount) {
    document.querySelector('input[name="amount"]').value = amount;
}
</script>
{% endblock %}
