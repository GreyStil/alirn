<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Alirn - Магазин игр{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --steam-bg: #1b2838;
            --steam-dark: #171a21;
            --steam-accent: #66c0f4;
            --steam-text: #c6d4df;
            --steam-light-text: #ffffff;
        }

        body {
            background-color: var(--steam-bg);
            color: var(--steam-text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .navbar {
            background-color: var(--steam-dark) !important;
            border-bottom: 3px solid #66c0f4;
        }

        .game-card {
            background-color: #2a475e;
            border-radius: 6px;
            overflow: hidden;
            transition: all 0.25s ease;
            border: 1px solid #3d4f5f;
            height: 100%;
        }

        .game-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(102, 192, 244, 0.25);
            border-color: #66c0f4;
        }

        .game-card img {
            transition: transform 0.3s ease;
        }

        .game-card:hover img {
            transform: scale(1.05);
        }

        .section-header {
            color: #ffffff;
            font-weight: 600;
            border-bottom: 2px solid #66c0f4;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .price {
            color: #acdbf5;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .hero {
            background: linear-gradient(rgba(23, 26, 33, 0.75), rgba(23, 26, 33, 0.85)), url('https://picsum.photos/id/1015/1920/1080') center/cover no-repeat;
            height: 520px;
            display: flex;
            align-items: center;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include 'shop/partials/navbar.html' %}

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    </div>

    {% block content %}{% endblock %}

    <!-- Floating AI Assistant -->
    <button onclick="openAIModal()" class="btn btn-danger rounded-circle position-fixed bottom-0 end-0 m-4 shadow-lg" style="width: 65px; height: 65px; font-size: 28px; z-index: 10000;">
        🤖
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
    <script>
        // AI Modal script will be added in base or individual pages
    </script>
</body>
</html>
