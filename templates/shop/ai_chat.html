<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ассистент - Alirn</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f0f23; color: #fff; margin: 0; padding: 20px; }
        .chat-container { max-width: 800px; margin: 0 auto; background: #1a1a2e; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .chat-header { background: #16213e; padding: 20px; text-align: center; }
        .chat-header h1 { margin: 0; color: #00d4ff; }
        .chat-messages { height: 500px; overflow-y: auto; padding: 20px; background: #0f0f23; }
        .message { margin-bottom: 15px; padding: 12px 16px; border-radius: 18px; max-width: 80%; }
        .user-message { background: #00d4ff; color: #000; margin-left: auto; border-bottom-right-radius: 4px; }
        .ai-message { background: #16213e; border-bottom-left-radius: 4px; }
        .chat-input { display: flex; padding: 20px; background: #16213e; }
        .chat-input input { flex: 1; padding: 14px; border: none; border-radius: 25px; background: #0f0f23; color: #fff; font-size: 16px; }
        .chat-input button { margin-left: 10px; padding: 14px 28px; background: #00d4ff; color: #000; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; }
        .example { font-size: 13px; color: #888; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 AI Ассистент Alirn</h1>
            <p>Добавляю реальные игры из RAWG в реальном времени</p>
        </div>
        
        <div class="chat-messages" id="messages">
            <div class="message ai-message">
                Привет! Я могу искать и добавлять настоящие игры из базы RAWG.<br>
                Попробуй: <strong>"добавь Elden Ring"</strong> или <strong>"найди RPG 2024"</strong>
            </div>
        </div>
        
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Напиши команду..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            // Add user message
            addMessage(message, 'user');
            input.value = '';

            try {
                const response = await fetch('/shop/ai-chat/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                
                const data = await response.json();
                addMessage(data.reply, 'ai');
            } catch (e) {
                addMessage('Ошибка соединения с AI.', 'ai');
            }
        }

        function addMessage(text, type) {
            const messagesDiv = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}-message`;
            msgDiv.innerHTML = text;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Welcome message already in HTML
    </script>
</body>
</html>
