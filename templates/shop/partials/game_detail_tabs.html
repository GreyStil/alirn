<ul class="nav nav-tabs mb-4" id="gameTabs" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active" id="about-tab" data-bs-toggle="tab" data-bs-target="#about" type="button" role="tab">О игре</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="screenshots-tab" data-bs-toggle="tab" data-bs-target="#screenshots" type="button" role="tab">Скриншоты</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="video-tab" data-bs-toggle="tab" data-bs-target="#video" type="button" role="tab">Видео</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="requirements-tab" data-bs-toggle="tab" data-bs-target="#requirements" type="button" role="tab">Системные требования</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="reviews-tab" data-bs-toggle="tab" data-bs-target="#reviews" type="button" role="tab">Отзывы</button>
    </li>
</ul>

<div class="tab-content" id="gameTabsContent">
    <!-- About tab content will be in main template or included separately -->
    <div class="tab-pane fade show active" id="about" role="tabpanel">
        {% block about_content %}{% endblock %}
    </div>
    <div class="tab-pane fade" id="screenshots" role="tabpanel">
        {% block screenshots_content %}{% endblock %}
    </div>
    <div class="tab-pane fade" id="video" role="tabpanel">
        {% block video_content %}{% endblock %}
    </div>
    <div class="tab-pane fade" id="requirements" role="tabpanel">
        {% block requirements_content %}{% endblock %}
    </div>
    <div class="tab-pane fade" id="reviews" role="tabpanel">
        {% block reviews_content %}{% endblock %}
    </div>
</div>
